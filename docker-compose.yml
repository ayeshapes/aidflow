# AidFlow - development stack.
# All values come from .env (git-ignored). Copy .env.example to .env first.
# "${VAR:?msg}" makes Compose stop with a clear error if VAR is not set.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      - aidflow_pgdata:/var/lib/postgresql/data
    # pg_isready asks Postgres "are you accepting connections?".
    # $$ stops Compose from substituting; the container's shell reads the variable.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    # No "ports:" on purpose: the database is reachable only from other
    # containers in this Compose project, never from the host or the network.

  backend:
    build: ./backend
    # --reload restarts the server when code changes (development only).
    # --proxy-headers/--forwarded-allow-ips: take the client IP from nginx's
    # X-Forwarded-For (needed by the login rate limiter). "*" is safe ONLY because
    # nothing but nginx can reach this container: it publishes no host port.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --proxy-headers --forwarded-allow-ips=*
    # The backend only receives the variables it needs (not the DB admin password).
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:?set FIELD_ENCRYPTION_KEY in .env}
      BACKUP_KEY: ${BACKUP_KEY:?set BACKUP_KEY in .env}
    volumes:
      - ./backend:/app          # source mounted so edits appear instantly
    depends_on:
      db:
        condition: service_healthy   # start only after Postgres is ready
    # No "ports:" on purpose (A-05): the backend is reachable only from other
    # containers on the Compose network, i.e. through nginx at https://localhost/api/.
    # "expose" is documentation only; it does not publish anything to the host.
    expose:
      - "8000"

  frontend:
    build: ./frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules       # keep the container's node_modules, not the host's
    ports:
      - "5173:5173"

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"     # only redirects to https
      - "443:443"
    volumes:
      - ./nginx/aidflow.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      # Server certificate and private key: READ-ONLY, and only these two files
      # (not the whole secrets/ folder, which also holds the CA key).
      # Host paths come from .env. create_host_path: false makes Compose stop
      # with an error if a file is missing, instead of creating an empty folder.
      # Cert not issued yet?  ./scripts/dev_self_signed_cert.sh  (TEMPORARY).
      - type: bind
        source: ${TLS_CERT_PATH:-./secrets/server.crt}
        target: /etc/nginx/certs/server.crt
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${TLS_KEY_PATH:-./secrets/server.key}
        target: /etc/nginx/certs/server.key
        read_only: true
        bind:
          create_host_path: false

volumes:
  aidflow_pgdata:
    name: aidflow_pgdata
