# Proxy settings shared by every location. This file MUST be included by every
# location that has a proxy_pass: nginx drops all inherited proxy_set_header
# lines in a location that sets its own, so these cannot live at server level.
# scripts/test_a05_config.sh fails if a proxy_pass location does not include it.

proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
# nginx is the edge: OVERWRITE X-Forwarded-For with the real peer address
# instead of appending ($proxy_add_x_forwarded_for) to whatever the client sent.
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;

# ---- Anti-spoofing (SEC-10) ------------------------------------------------
# The backend will later (ticket I-03) trust these two headers to learn who the
# client certificate belongs to. A client must never be able to send them.
# Setting a header to "" makes nginx NOT SEND it upstream, which also discards
# any value the client supplied. In I-03 these two lines are replaced with
#   proxy_set_header X-SSL-Client-Verify $ssl_client_verify;
#   proxy_set_header X-SSL-Client-S-DN   $ssl_client_s_dn;
# so the values always come from nginx's own TLS handshake, never from the client.
proxy_set_header X-SSL-Client-Verify "";
proxy_set_header X-SSL-Client-S-DN   "";
