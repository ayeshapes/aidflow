# Response headers common to every location. Included in EACH location because
# nginx does not inherit add_header into a location that defines its own
# add_header (the per-location Content-Security-Policy). "always" adds them to
# error responses (4xx/5xx) too.

# Browsers must use HTTPS for this host from now on (1 year).
# DEV NOTE: HSTS is per host, NOT per port. Once a browser has seen this, plain
# http://localhost:5173 (the Vite port) is upgraded to https and stops working
# in that browser. Use https://localhost instead. To undo in Chrome/Edge:
# chrome://net-internals/#hsts -> "Delete domain security policies" -> localhost.
add_header Strict-Transport-Security "max-age=31536000" always;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
