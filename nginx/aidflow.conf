# AidFlow - nginx reverse proxy (ticket A-05).
# Mounted as /etc/nginx/conf.d/default.conf, so it is read INSIDE the http{} block.
#
#   :80   -> 301 redirect to https
#   :443  -> TLS 1.2+ ; /api/ -> backend:8000 ; everything else -> frontend:5173
#
# The backend publishes no host port: this proxy is its only way in.
# The certificate and key are bind-mounted read-only by docker-compose.yml
# (paths come from TLS_CERT_PATH / TLS_KEY_PATH in .env).

server_tokens off;                       # do not advertise the nginx version

# Docker's internal DNS. Resolving at request time (variables in proxy_pass
# below) means nginx survives a backend/frontend container being recreated with
# a new IP, and it can start before they are up.
resolver 127.0.0.11 valid=10s ipv6=off;

# For the Vite dev server's websocket (hot reload).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ---------------------------------------------------------------- port 80
server {
    listen 80 default_server;
    server_name _;

    # Nothing is served over plain HTTP, not even /api/.
    return 301 https://$host$request_uri;
}

# --------------------------------------------------------------- port 443
server {
    listen 443 ssl default_server;
    server_name localhost;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    # TLS 1.2 and 1.3 only (1.0 / 1.1 / SSLv3 are refused).
    ssl_protocols TLSv1.2 TLSv1.3;
    # TLS 1.2 suites: ECDHE only (forward secrecy) with AEAD ciphers
    # (AES-GCM, ChaCha20-Poly1305). No RSA key exchange, CBC, 3DES, RC4, export
    # or NULL suites. TLS 1.3 suites are fixed by the protocol and all strong.
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;       # modern clients pick well; matches Mozilla "intermediate"
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;             # keeps forward secrecy intact

    set $backend_upstream  http://backend:8000;
    set $frontend_upstream http://frontend:5173;

    # ---- Swagger UI only: it loads its JS/CSS from a CDN, so it needs a looser
    # CSP than the rest of the API. (Exact match wins over the /api/ prefix.)
    location = /api/docs {
        include /etc/nginx/snippets/security_headers.conf;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: https://fastapi.tiangolo.com; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
        include /etc/nginx/snippets/proxy_common.conf;
        proxy_pass $backend_upstream;    # no URI part: the path is forwarded unchanged
    }

    # ---- API. JSON only, so the CSP forbids loading anything.
    location /api/ {
        include /etc/nginx/snippets/security_headers.conf;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
        include /etc/nginx/snippets/proxy_common.conf;
        proxy_pass $backend_upstream;
    }

    # ---- Everything else: the React app (Vite dev server).
    location / {
        include /etc/nginx/snippets/security_headers.conf;
        # DEV CSP. 'unsafe-inline' is needed by the Vite dev server (React
        # refresh preamble, injected styles) and wss: by its hot-reload socket.
        # Tighten it (drop 'unsafe-inline') once the frontend is a production build.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' wss://$host; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        include /etc/nginx/snippets/proxy_common.conf;
        proxy_set_header Upgrade    $http_upgrade;       # websocket for hot reload
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
        proxy_pass $frontend_upstream;
    }
}
